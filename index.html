<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oscar-Lucas Medrano</title>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inconsolata', monospace;
      color: white;
      background-color: black;
    }
    section {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      z-index: 0;
    }
    section.active {
      display: block;
    }
    #home {
      background-color: black;
    }
    #home video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }
    .header {
      position: fixed;
      top: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 10;
    }
    .header-left {
      text-align: left;
      cursor: pointer;
    }
    .header-left h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 200;
    }
    .header-left p {
      margin: 5px 0 0;
      font-size: 18px;
      font-weight: 200;
    }
    .header-right {
      position: relative;
      text-align: right;
    }
    .hamburger {
      cursor: pointer;
      z-index: 10;
    }
    .hamburger div {
      width: 30px;
      height: 3px;
      background-color: white;
      margin: 6px 0;
      transition: 0.4s;
    }
    .menu {
      display: none;
      position: absolute;
      top: 40px;
      right: 0;
      z-index: 10;
    }
    .menu.active {
      display: block;
    }
    .menu a {
      color: white;
      text-decoration: none;
      display: block;
      margin: 10px 0;
      font-size: 18px;
      cursor: pointer;
    }
    .menu a:hover {
      text-decoration: underline;
    }
    .content {
      padding: 80px 20px 20px;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }
    .content h2 {
      font-size: 28px;
      margin-bottom: 20px;
      font-weight: 200;
    }
    .content p {
      font-size: 18px;
      line-height: 1.6;
      font-weight: 200;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .contact-form label {
      font-size: 18px;
      margin: 10px 0 5px;
      text-align: left;
      width: 100%;
      max-width: 400px;
      font-weight: 200;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      margin-bottom: 15px;
      background-color: #333;
      border: 1px solid #555;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
      font-family: 'Inconsolata', monospace;
      font-weight: 200;
    }
    .contact-form textarea {
      height: 150px;
      resize: vertical;
    }
    .contact-form button {
      padding: 10px 20px;
      background-color: #555;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s;
      font-family: 'Inconsolata', monospace;
      font-weight: 200;
    }
    .contact-form button:hover {
      background-color: #777;
    }
    @media screen and (max-width: 768px) {
      #home video {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        object-position: center;
        min-width: 100%;
        min-height: 100%;
      }
      .header-left h1 {
        font-size: 18px;
      }
      .header-left p {
        font-size: 14px;
      }
      .hamburger div {
        width: 24px;
        height: 2px;
        margin: 5px 0;
      }
      .menu a {
        font-size: 16px;
        margin: 8px 0;
      }
      .content h2 {
        font-size: 24px;
      }
      .content p {
        font-size: 16px;
      }
      .contact-form label {
        font-size: 16px;
      }
      .contact-form input,
      .contact-form textarea {
        font-size: 14px;
      }
      .contact-form button {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <section id="home" class="active">
    <video autoplay muted loop playsinline id="background-video">
      <source src="Video1.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>
  <section id="about">
    <div class="content">
      <h2>About</h2>
      <p>Woodbury University B.Arch, Computer Science Design Computation Minor</p>
    </div>
  </section>
  <section id="projects">
    <div class="content">
      <h2>Projects</h2>
      <p>.01 The Primo Chateau</p>
    </div>
  </section>
  <section id="contact">
    <div class="content">
      <h2>Contact</h2>
      <form class="contact-form" action="https://formspree.io/f/oscar-lucas.medrano@woodbury.edu" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your Name" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="Your Phone Number">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your Message" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
  </section>
  <div class="header">
    <div class="header-left" onclick="showSection('home')">
      <h1>Oscar-Lucas Medrano</h1>
      <p>An Architectural Design Studio</p>
    </div>
    <div class="header-right">
      <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="menu" id="menu">
        <a onclick="showSection('about')">About</a>
        <a onclick="showSection('projects')">Projects</a>
        <a onclick="showSection('contact')">Contact</a>
      </div>
    </div>
  </div>
  <script>
    function toggleMenu() {
      document.getElementById('menu').classList.toggle('active');
    }
    function showSection(sectionId) {
      document.querySelectorAll('section').forEach(section => {
        section.classList.remove('active');
      });
      document.getElementById(sectionId).classList.add('active');
      toggleMenu();
    }
  </script>
</body>
</html>
