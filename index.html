<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oscar-Lucas Medrano</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      background-color: black; /* Fallback for video loading issues */
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }
    .header {
      position: fixed;
      top: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 20px;
      box-sizing: border-box;
    }
    .header-left {
      text-align: left;
    }
    .header-left h1 {
      margin: 0;
      font-size: 24px;
      font-weight: bold;
    }
    .header-left p {
      margin: 5px 0 0;
      font-size: 18px;
      font-weight: normal;
    }
    .header-right {
      position: relative;
      text-align: right;
    }
    .hamburger {
      cursor: pointer;
      z-index: 10;
    }
    .hamburger div {
      width: 30px;
      height: 3px;
      background-color: white;
      margin: 6px 0;
      transition: 0.4s;
    }
    .menu {
      display: none;
      position: absolute;
      top: 40px;
      right: 0;
      z-index: 10;
    }
    .menu.active {
      display: block;
    }
    .menu a {
      color: white;
      text-decoration: none;
      display: block;
      margin: 10px 0;
      font-size: 18px;
    }
    .menu a:hover {
      text-decoration: underline;
    }
    /* Mobile-specific adjustments */
    @media screen and (max-width: 768px) {
      video {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        object-position: center;
        min-width: 100%;
        min-height: 100%;
      }
      .header-left h1 {
        font-size: 18px;
      }
      .header-left p {
        font-size: 14px;
      }
      .hamburger div {
        width: 24px;
        height: 2px;
        margin: 5px 0;
      }
      .menu a {
        font-size: 16px;
        margin: 8px 0;
      }
    }
  </style>
</head>
<body>
  <video autoplay muted loop playsinline id="background-video">
    <source src="Video1.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="header">
    <div class="header-left">
      <h1>Oscar-Lucas Medrano</h1>
      <p>An Architectural Design Studio</p>
    </div>
    <div class="header-right">
      <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="menu" id="menu">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </div>
  <script>
    function toggleMenu() {
      document.getElementById('menu').classList.toggle('active');
    }
  </script>
</body>
</html>
